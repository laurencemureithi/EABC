<!doctype html>
<html lang="en" class="">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Opsloom Print{% endblock %}</title>
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('theme');
        const isDark = saved === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <!-- Web Fonts (Google Fonts CDN with local offline fallback) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

  <!-- Core Stylesheets (Local/Offline) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/tailwind/tailwind.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/inter/inter.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/material-symbols/material-symbols-outlined.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='vendor/chartjs/chart.umd.min.js') }}"></script>
  {% block page_styles %}{% endblock %}
</head>
<body class="bg-background-light dark:bg-dark-base text-slate-800 dark:text-slate-100 print-preview-page">
  <div class="print-preview-actions sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800 bg-slate-900 text-white shadow" data-no-print>
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div>
        <div class="text-xs font-black uppercase tracking-[0.18em] text-slate-400">Print Preview</div>
        <div class="text-sm font-bold text-white">{% block preview_title %}Opsloom Report{% endblock %}</div>
      </div>
      <div class="flex items-center gap-2">
        {% block preview_actions %}
        <button type="button" onclick="window.print()" class="inline-flex items-center gap-2 rounded-lg bg-ueal-gold text-white px-4 py-2 text-sm font-black shadow-md hover:opacity-90">
          <span class="material-symbols-outlined text-[18px]">print</span>
          Print
        </button>
        {% endblock %}
      </div>
    </div>
  </div>

  <main class="max-w-7xl mx-auto p-4 md:p-6 lg:p-8 print-preview-main">
    {% block content %}{% endblock %}
  </main>
  <button type="button" onclick="window.print()" class="fixed bottom-6 right-6 z-40 inline-flex items-center gap-2 rounded-full bg-ueal-gold text-white px-5 py-3 text-sm font-black shadow-2xl ring-4 ring-white/80 dark:ring-slate-900/80" data-no-print>
    <span class="material-symbols-outlined text-[18px]">print</span>
    Print Report
  </button>

  <script>
    (function(){
      const isAuto = {{ (request.args.get('autoprint') == '1' or request.args.get('autoprint') == 'true' or request.args.get('autoprint') == 'yes')|tojson if (request and request.args and request.args.get) else false }};
      if(!isAuto) return;
      let fired = false;
      function done(){
        if(fired) return;
        fired = true;
        setTimeout(function(){ window.print(); }, 550);
      }
      window.addEventListener('report:charts-ready', done, { once: true });
      window.addEventListener('load', function(){
        const hasTrendChart = !!document.getElementById('trendGrain') || !!document.getElementById('reportChart');
        if(!hasTrendChart || window.__reportChartsReady === true) return done();
        setTimeout(done, 4500);
      }, { once: true });
    })();
  </script>
  {% block page_scripts %}{% endblock %}
</body>
</html>
