<!doctype html>
<html lang="en" class="">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Opsloom Print{% endblock %}</title>
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('theme');
        const isDark = saved === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/tailwind/tailwind.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/inter/inter.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/material-symbols/material-symbols-outlined.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='vendor/chartjs/chart.umd.min.js') }}"></script>
  <style id="dynamicPrintOrientationStyle">
    @media print {
      @page {
        size: auto;
        margin: 10mm 10mm 12mm 10mm;
      }
    }
  </style>
  {% block page_styles %}{% endblock %}
</head>
<body class="bg-background-light dark:bg-dark-base text-slate-800 dark:text-slate-100 print-preview-page">
  <div class="print-preview-actions sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800 bg-slate-900 text-white shadow" data-no-print>
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="min-w-0">
        <div class="text-[10px] font-black uppercase tracking-[0.18em] text-slate-400">Print Preview • {{ active_company.name if active_company else 'Opsloom' }}</div>
        <div class="text-sm font-bold text-white truncate">{% block preview_title %}Opsloom Report{% endblock %}</div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <div class="inline-flex items-center rounded-lg bg-slate-800 p-1 border border-slate-700" role="group" aria-label="Page Orientation">
          <button type="button" id="orientPortraitBtn" onclick="setPrintOrientation('portrait')" class="px-2.5 py-1 rounded-md text-xs font-extrabold bg-ueal-purple text-white cursor-pointer inline-flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">crop_portrait</span>
            Portrait
          </button>
          <button type="button" id="orientLandscapeBtn" onclick="setPrintOrientation('landscape')" class="px-2.5 py-1 rounded-md text-xs font-extrabold text-slate-300 hover:text-white cursor-pointer inline-flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">crop_landscape</span>
            Landscape
          </button>
        </div>
        {% block preview_actions %}
        <button type="button" onclick="window.print()" class="inline-flex items-center gap-2 rounded-lg bg-ueal-gold text-white px-4 py-2 text-sm font-black shadow-md hover:opacity-90 cursor-pointer">
          <span class="material-symbols-outlined text-[18px]">print</span>
          Print
        </button>
        {% endblock %}
      </div>
    </div>
  </div>

  <main id="printPreviewMain" class="max-w-7xl mx-auto p-4 md:p-6 lg:p-8 print-preview-main">
    {% block content %}{% endblock %}
  </main>
  <button type="button" onclick="window.print()" class="fixed bottom-6 right-6 z-40 inline-flex items-center gap-2 rounded-full bg-ueal-gold text-white px-5 py-3 text-sm font-black shadow-2xl ring-4 ring-white/80 dark:ring-slate-900/80 cursor-pointer" data-no-print>
    <span class="material-symbols-outlined text-[18px]">print</span>
    Print Report
  </button>

  <script>
    function setPrintOrientation(mode) {
      const styleEl = document.getElementById('dynamicPrintOrientationStyle');
      const pBtn = document.getElementById('orientPortraitBtn');
      const lBtn = document.getElementById('orientLandscapeBtn');
      const mainEl = document.getElementById('printPreviewMain');
      if (mode === 'landscape') {
        if (styleEl) {
          styleEl.textContent = '@media print { @page { size: A4 landscape; margin: 10mm 10mm 12mm 10mm; } }';
        }
        document.body.classList.add('print-orientation-landscape');
        if (mainEl) mainEl.style.maxWidth = '100%';
        if (lBtn) lBtn.className = 'px-2.5 py-1 rounded-md text-xs font-extrabold bg-ueal-purple text-white cursor-pointer inline-flex items-center gap-1';
        if (pBtn) pBtn.className = 'px-2.5 py-1 rounded-md text-xs font-extrabold text-slate-300 hover:text-white cursor-pointer inline-flex items-center gap-1';
      } else {
        if (styleEl) {
          styleEl.textContent = '@media print { @page { size: auto; margin: 10mm 10mm 12mm 10mm; } }';
        }
        document.body.classList.remove('print-orientation-landscape');
        if (mainEl) mainEl.style.maxWidth = '';
        if (pBtn) pBtn.className = 'px-2.5 py-1 rounded-md text-xs font-extrabold bg-ueal-purple text-white cursor-pointer inline-flex items-center gap-1';
        if (lBtn) lBtn.className = 'px-2.5 py-1 rounded-md text-xs font-extrabold text-slate-300 hover:text-white cursor-pointer inline-flex items-center gap-1';
      }
    }

    // Wrap print content in a master repeating-header table so .eabc-doc-header repeats on EVERY page in both Portrait and Landscape
    function ensureRepeatingPrintHeaderStructure() {
      const shell = document.querySelector('.business-print-shell') || document.getElementById('printPreviewMain');
      if (!shell || shell.querySelector('.opsloom-repeating-doc-table')) return;
      const allHeaders = Array.from(shell.querySelectorAll('.eabc-doc-header'));
      if (!allHeaders.length) return;

      const primaryHeader = allHeaders[0].cloneNode(true);
      allHeaders.forEach(h => h.setAttribute('data-redundant-doc-header', '1'));

      const masterTable = document.createElement('table');
      masterTable.className = 'opsloom-repeating-doc-table';

      const thead = document.createElement('thead');
      thead.className = 'opsloom-repeating-doc-thead';
      const headTr = document.createElement('tr');
      const headTd = document.createElement('td');
      headTd.className = 'opsloom-repeating-doc-head-cell';
      headTd.appendChild(primaryHeader);
      headTr.appendChild(headTd);
      thead.appendChild(headTr);

      const tbody = document.createElement('tbody');
      tbody.className = 'opsloom-repeating-doc-tbody';
      const bodyTr = document.createElement('tr');
      const bodyTd = document.createElement('td');
      bodyTd.className = 'opsloom-repeating-doc-body-cell';

      while (shell.firstChild) {
        bodyTd.appendChild(shell.firstChild);
      }
      bodyTr.appendChild(bodyTd);
      tbody.appendChild(bodyTr);

      masterTable.appendChild(thead);
      masterTable.appendChild(tbody);
      shell.appendChild(masterTable);
    }

    document.addEventListener('DOMContentLoaded', ensureRepeatingPrintHeaderStructure);
    window.addEventListener('beforeprint', ensureRepeatingPrintHeaderStructure);

    (function(){
      const urlParams = new URLSearchParams(window.location.search);
      const orient = (urlParams.get('orientation') || '').toLowerCase();
      if (orient === 'landscape') {
        setPrintOrientation('landscape');
      }
      const isAuto = ['1', 'true', 'yes'].includes((urlParams.get('autoprint') || '').toLowerCase());
      if(!isAuto) return;
      let fired = false;
      function done(){
        if(fired) return;
        fired = true;
        ensureRepeatingPrintHeaderStructure();
        setTimeout(function(){ window.print(); }, 550);
      }
      window.addEventListener('report:charts-ready', done, { once: true });
      window.addEventListener('load', function(){
        const hasTrendChart = !!document.getElementById('trendGrain') || !!document.getElementById('reportChart');
        if(!hasTrendChart || window.__reportChartsReady === true) return done();
        setTimeout(done, 4500);
      }, { once: true });
    })();
  </script>
  {% block page_scripts %}{% endblock %}
</body>
</html>
